spring.application.name=ledgerline

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledgerline}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Never send Java stack traces to API clients (devtools enables them by default)
spring.web.error.include-stacktrace=never

# SQL initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/seed.sql
# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=900000