# Integration tests use their own database so they never touch development
# data. Create it once:  psql -U postgres -c "CREATE DATABASE ledgerline_test"
# DB_USERNAME / DB_PASSWORD are read the same way as in the main configuration.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/ledgerline_test}

# A fresh signing key for every run, so tests need no JWT_SECRET.
# 64 hex characters decode (as Base64) into a 384-bit HMAC key.
app.jwt.secret=${random.value}${random.value}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
