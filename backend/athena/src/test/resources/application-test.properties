# Integration tests use their own database so they never touch development
# data. Create it once:  psql -U postgres -c "CREATE DATABASE athena_test"
# DB_USERNAME / DB_PASSWORD are read the same way as in the main configuration.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/athena_test}
# Tests empty tables between tests, which only the schema owner may do, so
# they connect as the owner (DatabaseRolesIntegrationTest checks the app role).
spring.datasource.username=${DB_OWNER_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${DB_OWNER_PASSWORD:${DB_PASSWORD}}

# A fresh signing key for every run, so tests need no JWT_SECRET.
# 64 hex characters decode (as Base64) into a 384-bit HMAC key.
app.jwt.secret=${random.value}${random.value}

spring.jpa.show-sql=false
# Demo users, the first-admin bootstrap and Redis stay off in tests, even if
# a local .env sets them; the tests that need them switch them on themselves.
app.demo.enabled=false
app.bootstrap.admin.email=
app.bootstrap.admin.password=
app.bootstrap.only=false
app.redis.url=
spring.jpa.properties.hibernate.format_sql=false

# The suite sends hundreds of requests from 127.0.0.1 within a minute; the
# general limits are tested separately in RateLimitIntegrationTest.
app.security.rate-limit.api-requests-per-minute=1000000
app.security.rate-limit.registrations-per-hour=1000000
