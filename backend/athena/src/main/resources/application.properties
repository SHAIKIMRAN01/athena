spring.application.name=athena

# Local runs: also read settings from the project's .env file (git ignores
# it; scripts\setup-local.cmd creates it), so the database password and JWT
# key need not be typed into every new window. It is looked for where the app
# starts (backend\athena) and two folders up (the project root, the same file
# Docker Compose reads). Real environment variables always win, and with no
# .env (CI, Docker, Render) nothing changes.
spring.config.import=optional:file:./.env[.properties],optional:file:../../.env[.properties]

# Port: Render, Railway and similar platforms set PORT.
server.port=${PORT:8080}

# On a redeploy the platform sends SIGTERM: stop taking new requests, let the
# ones in flight finish (at most 20 s, inside Render's 30 s), then exit.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Compress the website's text files (the JavaScript bundle shrinks to about a
# third). API answers (JSON) are left uncompressed: they are small, and
# compressing secrets next to attacker-chosen text invites BREACH-style attacks.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,image/svg+xml
server.compression.min-response-size=1KB

# Behind a TLS-terminating proxy (Render, Railway, nginx) set this to native,
# so the client IP and https scheme come from X-Forwarded-* headers. Tomcat
# only trusts those headers from private-network proxies. Leave it as none
# when clients connect directly, or anyone could fake their IP.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# PostgreSQL: set DB_URL, or DB_HOST / DB_PORT / DB_NAME.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:athena}}
# The app's own login role (least privilege: normally athena_app, created at
# startup by DatabaseRolesProvisioner) ...
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
# ... and the schema owner, who runs schema.sql and seed.sql and creates that
# role. Without DB_OWNER_USERNAME, one user does both (no restricted role).
spring.sql.init.username=${DB_OWNER_USERNAME:${DB_USERNAME:postgres}}
spring.sql.init.password=${DB_OWNER_PASSWORD:${DB_PASSWORD}}
# Fail fast instead of hanging: wait at most 10 s for a free connection, and
# stop any single SQL statement (including waits for a row lock) after 15 s,
# so a stuck query cannot hold connections and starve every other request.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '15s'

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# List pages: load the accounts, users and roles of a whole page in one query
# each, instead of one query per row (the "N + 1" problem).
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Never send Java stack traces or exception messages to API clients
# (devtools enables them by default)
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# Static files are served by SpaWebConfig only (the built React app).
spring.web.resources.add-mappings=false

# SQL initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/seed.sql

# JWT: Base64 of at least 32 random bytes. Access tokens last 15 minutes.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION_MS:900000}

# Abuse protection (per client IP unless stated otherwise)
app.security.max-request-bytes=${MAX_REQUEST_BYTES:16384}
app.security.rate-limit.api-requests-per-minute=${API_RATE_LIMIT_PER_MINUTE:600}
app.security.rate-limit.registrations-per-hour=${REGISTRATION_LIMIT_PER_HOUR:50}
app.security.login.max-failures-per-account-and-ip=${LOGIN_MAX_FAILURES_PER_ACCOUNT_AND_IP:5}
app.security.login.max-failures-per-ip=${LOGIN_MAX_FAILURES_PER_IP:30}
app.security.login.max-failures-per-account=${LOGIN_MAX_FAILURES_PER_ACCOUNT:50}
app.security.login.lockout-minutes=${LOGIN_LOCKOUT_MINUTES:15}

# Redis holds the rate-limit and sign-in counters, shared by every server
# (redis://host:6379, or rediss:// for TLS). Without it they stay in this
# server's memory: fine on a developer's PC, not in production.
app.redis.url=${REDIS_URL:}
app.redis.timeout-ms=${REDIS_TIMEOUT_MS:1000}

# Comma-separated origins allowed to call the API from a browser. Empty: none
# (the deployed frontend is served from the same origin and needs none).
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Demo users (off unless DEMO_DATA_ENABLED=true). Passwords come only from
# the environment and are never committed.
app.demo.enabled=${DEMO_DATA_ENABLED:false}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:}
app.demo.auditor-password=${DEMO_AUDITOR_PASSWORD:}
app.demo.user-password=${DEMO_USER_PASSWORD:}

# First administrator (scripts/bootstrap-admin, or set these and start once):
# created only while no administrator exists, otherwise ignored. Remove the
# password afterwards. BOOTSTRAP_ONLY=true creates it and exits.
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:Athena Administrator}
app.bootstrap.only=${BOOTSTRAP_ONLY:false}
