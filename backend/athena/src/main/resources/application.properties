spring.application.name=athena

# Port: Render, Railway and similar platforms set PORT.
server.port=${PORT:8080}
server.shutdown=graceful

# Behind a TLS-terminating proxy (Render, Railway, nginx) set this to native,
# so the client IP and https scheme come from X-Forwarded-* headers. Tomcat
# only trusts those headers from private-network proxies. Leave it as none
# when clients connect directly, or anyone could fake their IP.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# PostgreSQL: set DB_URL, or DB_HOST / DB_PORT / DB_NAME.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:athena}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Never send Java stack traces or exception messages to API clients
# (devtools enables them by default)
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# Static files are served by SpaWebConfig only (the built React app).
spring.web.resources.add-mappings=false

# SQL initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/seed.sql

# JWT: Base64 of at least 32 random bytes. Access tokens last 15 minutes.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION_MS:900000}

# Abuse protection (per client IP unless stated otherwise)
app.security.max-request-bytes=${MAX_REQUEST_BYTES:16384}
app.security.rate-limit.api-requests-per-minute=${API_RATE_LIMIT_PER_MINUTE:600}
app.security.rate-limit.registrations-per-hour=${REGISTRATION_LIMIT_PER_HOUR:50}
app.security.login.max-failures-per-account-and-ip=${LOGIN_MAX_FAILURES_PER_ACCOUNT_AND_IP:5}
app.security.login.max-failures-per-ip=${LOGIN_MAX_FAILURES_PER_IP:30}
app.security.login.max-failures-per-account=${LOGIN_MAX_FAILURES_PER_ACCOUNT:50}
app.security.login.lockout-minutes=${LOGIN_LOCKOUT_MINUTES:15}

# Comma-separated origins allowed to call the API from a browser. Empty: none
# (the deployed frontend is served from the same origin and needs none).
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Demo users (off unless DEMO_DATA_ENABLED=true). Passwords come only from
# the environment and are never committed.
app.demo.enabled=${DEMO_DATA_ENABLED:false}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:}
app.demo.auditor-password=${DEMO_AUDITOR_PASSWORD:}
app.demo.user-password=${DEMO_USER_PASSWORD:}
